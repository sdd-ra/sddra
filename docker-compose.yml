# SDDRA sandbox compose — reference implementation of [R59]-[R66], [R91], [R92], [R102].
# Hard rules encoded here:
#   [R91]  NO external/registry service images — every service builds from the LOCAL Dockerfile.
#   [R92]  ALL bind mounts live under project-root var/ — named volumes FORBIDDEN.
#   [R102] Resource limits are MANDATORY even when upstream defines none.
services:
  sdd-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sddra-sandbox:local
    init: true
    read_only: true
    user: "1000:1000"
    working_dir: /workspace
    environment:
      - SANDBOX_RO=1
    command: ["node", "-e", "console.log('SDDRA sandbox ready'); setInterval(()=>{},60000)"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/sdd:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 512
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    volumes:
      - ./var/sandbox:/var/sandbox
      - ./var/sandbox/.claude-sdd:/workspace/.claude/sdd
      - ./var/sandbox/tmp:/workspace/tmp
      - ./prompts:/workspace/prompts
    networks:
      - sdd-internal

  fe-builder:
    build:
      context: .
      dockerfile: Dockerfile.fe-builder
      args:
        FRAMEWORK: react
    image: sddra-fe-builder:local
    init: true
    read_only: true
    user: "1000:1000"
    working_dir: /workspace
    environment:
      - SANDBOX_RO=1
    command: ["sh", "-c", "while true; do echo FE Builder running; sleep 60; done"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 512
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    volumes:
      - ./var/fe:/workspace/dist
      - ./var/fe/source:/workspace/src
    networks:
      - sdd-internal

  be-builder:
    build:
      context: .
      dockerfile: Dockerfile.be-builder
      args:
        RUNTIME: node
    image: sddra-be-builder:local
    init: true
    read_only: true
    user: "1000:1000"
    working_dir: /workspace
    environment:
      - SANDBOX_RO=1
    command: ["sh", "-c", "while true; do echo BE Builder running; sleep 60; done"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode:1777
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
          pids: 1024
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4.0
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    ports:
      - "3000:3000"
    volumes:
      - ./var/be:/workspace
    networks:
      - sdd-internal

  mobile-builder:
    build:
      context: .
      dockerfile: Dockerfile.mobile-builder
    image: sddra-mobile-builder:local
    init: true
    read_only: true
    user: "1000:1000"
    working_dir: /workspace
    environment:
      - SANDBOX_RO=1
    command: ["sh", "-c", "while true; do echo Mobile Builder running; sleep 60; done"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode:1777
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
          pids: 1024
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4.0
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    volumes:
      - ./var/mobile-build:/workspace/output
    networks:
      - sdd-internal

networks:
  sdd-internal:
    internal: true
